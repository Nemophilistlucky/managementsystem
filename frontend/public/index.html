<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>智慧学工-家校互通系统登录门户</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-4xl bg-slate-900 rounded-2xl border border-slate-800 p-8 shadow-2xl space-y-8">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-sky-400">寻道大学智慧学工-寒暑假家长信管理系统</h1>
            <p class="text-xs text-slate-500 mt-2">合同全履约版 · 实体物理数据库级家校多端互通门户</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700/50 hover:border-sky-500/40 transition flex flex-col justify-between space-y-4">
                <div>
                    <h3 class="text-base font-bold text-sky-400 flex items-center gap-2">🏛️ 学校/学院管理层登录端</h3>
                    <p class="text-slate-400 text-xs mt-1 leading-relaxed">包含：学校用户全局监督统计（一级）、学院用户模板套用共享（二级）、以及辅导员用户花名册与短信批量调度发送（三级）。</p>
                </div>
                <a href="admin.html" class="block w-full bg-sky-600 hover:bg-sky-700 text-white font-bold text-center py-2 rounded-lg text-xs shadow transition">
                    进入管理后台端
                </a>
            </div>

            <div class="bg-slate-800/50 p-6 rounded-xl border border-slate-700/50 hover:border-indigo-500/40 transition flex flex-col justify-between space-y-4">
                <div>
                    <h3 class="text-base font-bold text-indigo-400 flex items-center gap-2">📱 学生家长移动端 H5 入口</h3>
                    <p class="text-slate-400 text-xs mt-1 leading-relaxed">提供家长通过短信内置链接跳转。支持使用身份证号及初始密码鉴权，在线查阅安全告知书、教务处同步成绩单并向学校回传反馈。</p>
                </div>
                <a href="parent.html" class="block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-center py-2 rounded-lg text-xs shadow transition">
                    模拟打开手机家长端
                </a>
            </div>
        </div>
    </div>
</body>
</html>
