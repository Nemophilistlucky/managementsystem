<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>寻道智慧学工-家校互通一体化管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>

    <style>
        .animate-fade-in { animation: fadeIn 0.3s ease-in-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        /* 深度定制富文本编辑器暗黑主题 */
        .ql-toolbar.ql-snow, .ql-container.ql-snow { border-color: #334155 !important; }
        .ql-snow .ql-stroke { stroke: #94a3b8 !important; }
        .ql-snow .ql-fill { fill: #94a3b8 !important; }
        .ql-snow .ql-picker { color: #94a3b8 !important; }
        .ql-editor { color: #f8fafc; min-height: 200px; font-family: ui-sans-serif, system-ui; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans flex overflow-hidden">

    <div id="customModal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-[100] backdrop-blur-sm transition-opacity">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 w-full max-w-md shadow-2xl transform scale-95 transition-transform" id="modalContent">
            <h3 id="modalTitle" class="text-sky-400 font-bold text-lg mb-3">系统提示</h3>
            <div id="modalMessage" class="text-sm text-slate-300 mb-5 leading-relaxed"></div>
            <div id="modalInputs" class="space-y-4 mb-5 hidden"></div>
            <div class="flex justify-end gap-3 pt-2 border-t border-slate-700/60">
                <button id="modalCancel" class="px-4 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition hidden">取消</button>
                <button id="modalConfirm" class="px-5 py-2 text-xs font-bold bg-sky-600 hover:bg-sky-500 rounded text-white shadow transition">确认</button>
            </div>
        </div>
    </div>

    <div id="loginPortal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 transition-all duration-500">
        <div class="bg-slate-800/80 backdrop-blur border border-slate-700/50 p-10 rounded-2xl shadow-2xl max-w-[400px] w-full relative">
            <div class="absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r from-sky-400 via-indigo-500 to-purple-500 rounded-t-2xl"></div>
            <h2 class="text-2xl font-bold text-center text-slate-100 mb-1 tracking-wider">智慧学工系统</h2>
            <p class="text-center text-slate-500 text-xs mb-8">家校互通一体化平台</p>
            
            <div class="flex bg-slate-900/50 rounded-lg p-1 mb-8 border border-slate-700/50">
                <button id="tabAdmin" onclick="switchLoginTab('admin')" class="flex-1 py-2 text-xs font-bold bg-slate-700 text-white rounded-md shadow transition">教务管理端</button>
                <button id="tabParent" onclick="switchLoginTab('parent')" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 transition">家长查阅端</button>
            </div>

            <div id="formAdmin" class="space-y-5">
                <div>
                    <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 pl-1">Account</label>
                    <input id="adminUsername" type="text" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 pl-1">Password</label>
                    <input id="adminPassword" type="password" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-sky-500 transition">
                </div>
                <button onclick="doAdminLogin()" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-3 rounded-lg mt-4 shadow-lg shadow-sky-900/20 transition">登 录</button>
            </div>

            <div id="formParent" class="space-y-5 hidden">
                <div>
                    <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 pl-1">Student ID Card</label>
                    <input id="parentIdCard" type="text" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-[10px] text-slate-500 uppercase tracking-widest mb-1 pl-1">Access Code</label>
                    <input id="parentPassword" type="password" class="w-full bg-slate-900/80 border border-slate-700 rounded-lg p-3 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition">
                </div>
                <button onclick="doParentLogin()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg mt-4 shadow-lg shadow-indigo-900/20 transition">查 阅 信 件</button>
            </div>
        </div>
    </div>

    <div id="adminDashboard" class="hidden flex w-full h-screen">
        <div class="w-64 bg-[#0B1120] border-r border-slate-800 flex flex-col shadow-2xl z-10">
            <div class="p-6 flex flex-col items-center pt-10">
                <div class="w-16 h-16 bg-gradient-to-br from-sky-400 to-indigo-600 rounded-2xl flex items-center justify-center text-3xl mb-4 shadow-lg shadow-sky-900/30 rotate-3">🏫</div>
                <h3 class="font-bold text-slate-100 text-sm tracking-wide">综合教务管理平台</h3>
            </div>
            <div class="flex-1 overflow-y-auto no-scrollbar py-4 px-4 space-y-2 mt-4">
                <button onclick="switchAdminMenu('edit')" id="menu-edit" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl bg-sky-500/10 text-sky-400 font-bold text-xs transition border border-sky-500/20">
                    📝 信件内容编辑
                </button>
                <button onclick="switchAdminMenu('send')" id="menu-send" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 text-xs transition border border-transparent">
                    📨 信件信息发送
                </button>
                <button onclick="switchAdminMenu('stats')" id="menu-stats" class="w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 text-xs transition border border-transparent">
                    📊 综合结果统计
                </button>
            </div>
            <div class="p-4 border-t border-slate-800">
                <button onclick="logout()" class="w-full flex justify-center items-center gap-2 px-4 py-3 rounded-xl text-xs font-bold text-slate-400 hover:text-rose-400 hover:bg-rose-500/10 transition">
                    退出系统
                </button>
            </div>
        </div>

        <div class="flex-1 bg-[#0F172A] overflow-y-auto p-10">
            
            <div id="view-edit" class="animate-fade-in space-y-6 max-w-4xl">
                <div class="border-b border-slate-800 pb-5 mb-8">
                    <h2 class="text-2xl font-bold text-slate-100">信件模板配置</h2>
                    <p class="text-xs text-slate-400 mt-2">支持Word直贴、图片上传、多链接设置与动态院徽替换。</p>
                </div>
                
                <div class="bg-slate-800/50 p-8 rounded-2xl border border-slate-700/50 space-y-6">
                    <div class="grid grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">H5视觉风格 (背景色)</label>
                            <select id="bgStyle" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                                <option value="bg-slate-900">极夜暗黑风格</option>
                                <option value="bg-indigo-950">深邃极光靛青</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-2">底部徽标/院徽设定</label>
                            <select id="badgeSelect" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                                <option value="https://img.icons8.com/color/96/university.png">🎓 默认通用学校校徽</option>
                                <option value="https://img.icons8.com/color/96/code-badge.png">💻 计算机学院定制院徽</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-2">通知书大标题</label>
                        <input id="tplTitle" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200">
                    </div>
                    
                    <div>
                        <label class="block text-xs text-slate-400 mb-2 flex justify-between">
                            <span>安全告知书正文 (Rich Text Editor)</span>
                            <span class="text-sky-400">✅ 支持直接粘贴 Word 格式及图片</span>
                        </label>
                        <div class="bg-slate-900 rounded-lg overflow-hidden border border-slate-700">
                            <div id="quillEditor"></div>
                        </div>
                    </div>

                    <button onclick="saveTemplate()" class="bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400 text-white font-bold py-3 px-8 rounded-lg transition shadow-lg shadow-sky-900/20 text-sm">
                        发布并共享此模板
                    </button>
                </div>
            </div>

            <div id="view-send" class="hidden animate-fade-in space-y-6">
                <div class="border-b border-slate-800 pb-5 mb-8 flex justify-between items-end">
                    <div>
                        <h2 class="text-2xl font-bold text-slate-100">信件发送与名册管理</h2>
                        <p class="text-xs text-slate-400 mt-2">辅导员专属权限：修改降级联系人(如奶奶)、录入班干部表现、对接短信中台。</p>
                    </div>
                    <button onclick="triggerSmsSend()" class="bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-400 hover:to-purple-400 text-white font-bold py-2 px-6 rounded-lg shadow-lg text-sm transition">
                        批量推送短信通知
                    </button>
                </div>

                <div class="bg-slate-800/50 rounded-2xl border border-slate-700/50 overflow-hidden shadow-lg">
                    <table class="w-full text-left text-xs">
                        <thead class="bg-slate-900 text-slate-400 tracking-wider border-b border-slate-700">
                            <tr>
                                <th class="p-4 w-12 text-center"><input type="checkbox" onclick="toggleSelectAll(this)" class="rounded bg-slate-800 border-slate-600"></th>
                                <th class="p-4">姓名/学号</th>
                                <th class="p-4">家长联系人(顺位降级)</th>
                                <th class="p-4">网关短信状态</th>
                                <th class="p-4 text-right">个性化补录操作</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody" class="divide-y divide-slate-700/30"></tbody>
                    </table>
                </div>
            </div>

            <div id="view-stats" class="hidden animate-fade-in space-y-6">
                <div class="border-b border-slate-800 pb-5 mb-8">
                    <h2 class="text-2xl font-bold text-slate-100">综合报表大屏</h2>
                </div>
                <div id="statsDashboard" class="grid grid-cols-4 gap-6 mb-8"></div>
                
                <div class="grid grid-cols-2 gap-6">
                    <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 shadow-lg">
                        <h3 class="text-sm font-bold text-slate-200 mb-4 flex items-center gap-2">二级下钻：各学院监控</h3>
                        <div id="college下钻" class="flex flex-col gap-3"></div>
                    </div>
                    <div class="bg-slate-800/50 p-6 rounded-2xl border border-slate-700/50 shadow-lg">
                        <h3 class="text-sm font-bold text-slate-200 mb-4 flex items-center gap-2">家长H5回传意见反馈</h3>
                        <div id="feedbackContainer" class="space-y-3"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>


    <div id="parentDashboard" class="hidden min-h-screen flex items-center justify-center p-4 bg-slate-950 animate-fade-in">
        <div class="w-full max-w-md relative">
            <button onclick="logout()" class="absolute -top-12 right-0 text-slate-400 hover:text-white text-xs bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">退出查阅</button>
            
            <div id="h5Canvas" class="p-6 rounded-2xl border border-slate-700 shadow-2xl transition-all duration-300">
                <div class="flex justify-between items-center border-b border-slate-700/60 pb-4 mb-4">
                    <h4 id="canvasTitle" class="font-bold text-base text-sky-400"></h4>
                    <img id="canvasBadge" src="" class="w-10 h-10 object-contain" alt="院徽">
                </div>
                
                <div id="canvasMain" class="text-slate-200 leading-relaxed text-[13px] font-sans ql-editor px-0 pb-0"></div>
                
                <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-700 mt-6 shadow-inner relative">
                    <div class="absolute top-3 left-4 text-[10px] text-emerald-400 font-bold tracking-widest uppercase">教务处成绩视图同步</div>
                    <div id="chartContainer" style="width: 100%; height: 220px;" class="mt-4"></div>
                </div>

                <div class="pt-5 mt-6 border-t border-slate-700/60 flex flex-col gap-4">
                    <div class="text-xs text-slate-400 flex justify-between items-center">
                        <span class="flex items-center gap-1">🔗 <a id="canvasLink" href="#" target="_blank" class="text-sky-400 underline decoration-sky-400/30 underline-offset-2"></a></span>
                        <button onclick="parentModifyPassword()" class="text-slate-300 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-600 transition">自主改密</button>
                    </div>
                    <div class="flex gap-2 mt-1">
                        <input id="parentFeedbackInput" type="text" placeholder="回传意见给辅导员(选填)..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-slate-200 focus:outline-none focus:border-sky-500">
                        <button onclick="submitParentFeedback()" class="bg-sky-600 hover:bg-sky-500 px-4 py-2.5 rounded-lg text-xs font-bold text-white shadow transition">提交</button>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <script>
        const API_BASE = 'http://localhost:8080/api/v1'; // 确保你的Java服务开启
        let currentStudentH5 = null;
        let quill; // 富文本实例
        let gradeChart; // Echarts实例

        // ----------- 1. 初始化富文本编辑器 (Quill.js) -----------
        window.onload = function() {
            quill = new Quill('#quillEditor', {
                theme: 'snow',
                placeholder: '支持Word内容直接带格式粘贴，支持插入网络图片链接...',
                modules: {
                    toolbar: [
                        [{ 'header': [1, 2, 3, false] }],
                        ['bold', 'italic', 'underline', 'strike'],
                        [{ 'color': [] }, { 'background': [] }],
                        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                        ['link', 'image'],
                        ['clean']
                    ]
                }
            });
        };

        // ----------- 2. 全局自定义 Modal 逻辑 -----------
        const Modal = {
            show(title, message, inputs = [], confirmCallback) {
                document.getElementById('modalTitle').innerText = title;
                document.getElementById('modalMessage').innerHTML = message;
                
                const inputsContainer = document.getElementById('modalInputs');
                if (inputs.length > 0) {
                    inputsContainer.classList.remove('hidden');
                    inputsContainer.innerHTML = inputs.map(inp => `
                        <div>
                            <label class="block text-[10px] text-slate-400 uppercase mb-1">${inp.label}</label>
                            <input id="${inp.id}" type="${inp.type||'text'}" value="${inp.value||''}" placeholder="${inp.placeholder||''}" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        </div>
                    `).join('');
                } else {
                    inputsContainer.classList.add('hidden');
                }

                const cancelBtn = document.getElementById('modalCancel');
                if(inputs.length > 0 || title.includes('确认')) cancelBtn.classList.remove('hidden');
                else cancelBtn.classList.add('hidden');

                const modal = document.getElementById('customModal');
                const content = document.getElementById('modalContent');
                modal.classList.remove('hidden');
                modal.classList.add('flex');
                setTimeout(() => {
                    modal.classList.add('opacity-100');
                    content.classList.remove('scale-95');
                    content.classList.add('scale-100');
                }, 10);

                // 绑定按钮事件
                document.getElementById('modalConfirm').onclick = () => {
                    let result = {};
                    inputs.forEach(inp => result[inp.id] = document.getElementById(inp.id).value);
                    if(confirmCallback) confirmCallback(result);
                    Modal.close();
                };
                cancelBtn.onclick = Modal.close;
            },
            close() {
                const modal = document.getElementById('customModal');
                const content = document.getElementById('modalContent');
                modal.classList.remove('opacity-100');
                content.classList.remove('scale-100');
                content.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
            }
        };

        // 替换原生弹窗为自定义弹窗
        window.alert = (msg) => Modal.show("系统提示", msg);


        // ----------- 3. 视图路由与交互 -----------
        function switchLoginTab(role) {
            document.getElementById('formAdmin').classList.toggle('hidden', role !== 'admin');
            document.getElementById('formParent').classList.toggle('hidden', role !== 'parent');
            document.getElementById('tabAdmin').className = role === 'admin' ? "flex-1 py-2 text-xs font-bold bg-slate-700 text-white rounded-md shadow" : "flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200";
            document.getElementById('tabParent').className = role === 'parent' ? "flex-1 py-2 text-xs font-bold bg-slate-700 text-white rounded-md shadow" : "flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200";
        }

        function switchAdminMenu(menuId) {
            ['edit', 'send', 'stats'].forEach(id => {
                document.getElementById('view-' + id).classList.add('hidden');
                document.getElementById('menu-' + id).className = "w-full flex items-center gap-3 px-4 py-3.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-slate-200 text-xs transition border border-transparent";
            });
            document.getElementById('view-' + menuId).classList.remove('hidden');
            document.getElementById('menu-' + menuId).className = "w-full flex items-center gap-3 px-4 py-3.5 rounded-xl bg-sky-500/10 text-sky-400 font-bold text-xs transition border border-sky-500/20 shadow-inner";
        }

        function doAdminLogin() {
            const u = document.getElementById('adminUsername').value;
            const p = document.getElementById('adminPassword').value;
            fetch(`${API_BASE}/admin/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p})
            }).then(res => res.json()).then(data => {
                if(data.code === 200) {
                    document.getElementById('loginPortal').classList.add('hidden');
                    document.getElementById('adminDashboard').classList.remove('hidden');
                    loadTemplate();
                    loadStudentData();
                } else alert(data.msg);
            });
        }

        function doParentLogin() {
            const idCard = document.getElementById('parentIdCard').value;
            const password = document.getElementById('parentPassword').value;
            fetch(`${API_BASE}/parent/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ idCard, password })
            }).then(res => res.json()).then(data => {
                if(data.code !== 200) { alert(data.msg); return; }
                currentStudentH5 = data.student;
                document.getElementById('loginPortal').classList.add('hidden');
                document.getElementById('parentDashboard').classList.remove('hidden');
                
                // 渲染H5与富文本
                document.getElementById('h5Canvas').className = `p-6 rounded-2xl border border-slate-700 shadow-2xl transition-all duration-300 ${data.template.bgStyle}`;
                document.getElementById('canvasTitle').innerText = data.template.title;
                document.getElementById('canvasBadge').src = data.template.badgeUrl;
                
                // 注意：富文本直接渲染为 HTML
                document.getElementById('canvasMain').innerHTML = `
                    <div class="mb-3 text-sky-300 font-bold text-sm border-b border-slate-700/50 pb-2">尊敬的 ${data.student.parentName} (${data.student.relation})：</div>
                    ${data.template.content}
                    <div class="mt-4 text-emerald-400 font-semibold text-xs flex items-center gap-1"><span>📌</span> 辅导员特别寄语(获奖与班干部)：</div>
                    <div class="text-slate-300 bg-slate-900/50 p-3 rounded-lg border border-slate-700/50 mt-1.5 text-xs italic">${data.student.awards || '该生本学期表现平稳。'}</div>
                `;
                
                document.getElementById('canvasLink').innerText = data.template.links[0].title;
                document.getElementById('canvasLink').href = data.template.links[0].url;

                // 渲染 ECharts 成绩可视化
                renderGradeChart(data.student.score);
            });
        }

        function logout() {
            document.getElementById('adminDashboard').classList.add('hidden');
            document.getElementById('parentDashboard').classList.add('hidden');
            document.getElementById('loginPortal').classList.remove('hidden');
            currentStudentH5 = null;
        }

        // ----------- 4. ECharts 数据解析与渲染 -----------
        function renderGradeChart(scoreString) {
            // 简单的解析引擎："高等数学: 优秀(95分), 数据库: 92分" -> { 高等数学: 95, 数据库: 92 }
            const courses = [];
            const scores = [];
            const parts = scoreString.split(',');
            parts.forEach(part => {
                const kv = part.split(':');
                if(kv.length === 2) {
                    courses.push(kv[0].trim().substring(0, 5)); // 课程名截断防止太长
                    // 提取数字
                    const numMatch = kv[1].match(/\d+/);
                    scores.push(numMatch ? parseInt(numMatch[0]) : 0);
                }
            });

            if(!gradeChart) gradeChart = echarts.init(document.getElementById('chartContainer'));
            
            const option = {
                tooltip: { trigger: 'axis', backgroundColor: 'rgba(15, 23, 42, 0.9)', borderColor: '#334155', textStyle: { color: '#f8fafc' } },
                grid: { top: '15%', left: '3%', right: '4%', bottom: '3%', containLabel: true },
                xAxis: { type: 'category', data: courses, axisLabel: { color: '#94a3b8', fontSize: 10 } },
                yAxis: { type: 'value', max: 100, splitLine: { lineStyle: { color: '#334155', type: 'dashed' } }, axisLabel: { color: '#94a3b8', fontSize: 10 } },
                series: [{
                    data: scores,
                    type: 'bar',
                    barWidth: '40%',
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#38bdf8' },
                            { offset: 1, color: '#818cf8' }
                        ]),
                        borderRadius: [4, 4, 0, 0]
                    },
                    label: { show: true, position: 'top', color: '#f8fafc', fontSize: 10, fontWeight: 'bold' }
                }]
            };
            gradeChart.setOption(option);
        }

        // ----------- 5. 管理端后台业务交互 -----------
        function loadTemplate() {
            fetch(`${API_BASE}/template`).then(res => res.json()).then(data => {
                document.getElementById('bgStyle').value = data.bgStyle;
                document.getElementById('tplTitle').value = data.title;
                document.getElementById('badgeSelect').value = data.badgeUrl;
                // 将后台富文本推入 Quill
                quill.root.innerHTML = data.content;
            });
        }

        function saveTemplate() {
            fetch(`${API_BASE}/template/update`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    bgStyle: document.getElementById('bgStyle').value,
                    title: document.getElementById('tplTitle').value,
                    content: quill.root.innerHTML, // 获取富文本HTML
                    badgeUrl: document.getElementById('badgeSelect').value
                })
            }).then(res => res.json()).then(data => alert(data.msg));
        }

        function loadStudentData() {
            const isPhoneEmpty = document.getElementById('filterPhone').value;
            fetch(`${API_BASE}/students?phoneEmpty=${isPhoneEmpty}&isRead=`)
                .then(res => res.json()).then(list => {
                    const tbody = document.getElementById('studentTableBody'); tbody.innerHTML = '';
                    const fbContainer = document.getElementById('feedbackContainer'); fbContainer.innerHTML = '';
                    
                    list.forEach(s => {
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-800/60 transition text-slate-300";
                        const smsClass = s.status === '已成功发送' ? 'bg-emerald-500/10 text-emerald-400' : s.status.includes('失败') ? 'bg-rose-500/10 text-rose-400' : 'bg-slate-700';
                        const phoneDisplay = s.phone ? s.phone : '<span class="text-rose-400 font-bold bg-rose-500/10 px-1.5 rounded">暂无(需补录)</span>';
                        tr.innerHTML = `
                            <td class="p-4 text-center"><input type="checkbox" name="studentCheck" value="${s.id}" class="rounded bg-slate-900 border-slate-700"></td>
                            <td class="p-4 font-semibold">${s.name}<br><span class="text-[10px] text-slate-500 font-mono">${s.idCard}</span></td>
                            <td class="p-4"><span class="px-1.5 py-0.5 rounded bg-slate-950 text-sky-400 font-mono text-[10px] mr-2 border border-sky-900/50">${s.relation || '未匹配'}</span>${s.parentName || '未补录'}</td>
                            <td class="p-4 font-mono text-[11px]">${phoneDisplay}<br><span class="inline-block mt-1 px-2 py-0.5 rounded text-[9px] ${smsClass}">${s.status}</span></td>
                            <td class="p-4 text-right">
                                <button onclick="辅导员更改家长栏('${s.id}', '${s.parentName}', '${s.phone}')" class="text-sky-400 hover:text-sky-300 bg-sky-900/30 border border-sky-500/20 px-3 py-1.5 rounded-lg text-[11px] transition">手工补录/订正</button>
                            </td>
                        `;
                        tbody.appendChild(tr);

                        if(s.feedbackContent) {
                            fbContainer.innerHTML += `
                                <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50">
                                    <div class="flex justify-between text-[11px] text-slate-400 mb-2">
                                        <span>学生: <strong class="text-slate-200">${s.name}</strong></span>
                                        <span>家长: ${s.parentName}</span>
                                    </div>
                                    <div class="text-slate-300 text-xs italic tracking-wide">" ${s.feedbackContent} "</div>
                                </div>
                            `;
                        }
                    });
                    if(fbContainer.innerHTML === '') fbContainer.innerHTML = '<p class="text-slate-500 text-xs p-4">暂无家长回传反馈。</p>';
                    updateStatsDisplay();
                });
        }

        function updateStatsDisplay() {
            fetch(`${API_BASE}/statistics/report`).then(res => res.json()).then(report => {
                document.getElementById('statsDashboard').innerHTML = `
                    <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 flex flex-col justify-center"><span class="text-slate-500 text-xs mb-1">应发基数</span> <span class="text-slate-100 font-bold text-3xl">${report.total}</span></div>
                    <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 flex flex-col justify-center"><span class="text-purple-400 text-xs mb-1">实发成功数</span> <span class="text-purple-400 font-bold text-3xl">${report.sent}</span></div>
                    <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 flex flex-col justify-center"><span class="text-indigo-400 text-xs mb-1">全校完成率</span> <span class="text-indigo-400 font-bold text-3xl">${report.completionRate}</span></div>
                    <div class="bg-slate-800/50 p-5 rounded-2xl border border-slate-700/50 flex flex-col justify-center"><span class="text-emerald-400 text-xs mb-1">家长查阅率</span> <span class="text-emerald-400 font-bold text-3xl">${report.readRate}</span></div>
                `;
            });
        }

        function toggleSelectAll(master) { document.querySelectorAll('input[name="studentCheck"]').forEach(cb => cb.checked = master.checked); }
        function triggerSmsSend() {
            const ids = Array.from(document.querySelectorAll('input[name="studentCheck"]:checked')).map(cb => cb.value);
            if(ids.length === 0) { alert("请先在列表中勾选要发送的学生家长！"); return; }
            fetch(`${API_BASE}/sms/send-batch`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(ids) })
                .then(res => res.json()).then(data => { alert(data.msg); loadStudentData(); });
        }

        // 调用自定义弹窗实现辅导员补录
        function 辅导员更改家长栏(id, currentName, currentPhone) {
            Modal.show(
                "手工补录与订正 (辅导员专享)", 
                "可强制更改家长顺位(如指定发送给奶奶)，并录入班干部评价等无源数据。",
                [
                    { id: 'rel', label: '与学生关系 (如: 奶奶)', value: '奶奶' },
                    { id: 'name', label: '联系人姓名', value: currentName || '' },
                    { id: 'phone', label: '手机号码 (用于重发短信)', value: currentPhone === '暂无' ? '' : currentPhone },
                    { id: 'awards', label: '辅导员寄语 (获奖/表现)', value: '该生本学期表现优异，担任班干部。' }
                ],
                (result) => {
                    fetch(`${API_BASE}/student/update-parent`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ id, parentName: result.name, relation: result.rel, phone: result.phone, awards: result.awards })
                    }).then(res => res.json()).then(data => { alert(data.msg); loadStudentData(); });
                }
            );
        }

        function parentModifyPassword() {
            Modal.show("修改密码", "请输入您的新查询密码：", [{id: 'np', label: '新密码', type: 'password'}], (res) => {
                fetch(`${API_BASE}/parent/change-pwd`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ idCard: currentStudentH5.idCard, newPwd: res.np }) })
                    .then(r => r.json()).then(data => alert(data.msg));
            });
        }

        function submitParentFeedback() {
            const feedbackText = document.getElementById('parentFeedbackInput').value;
            if(!feedbackText) return alert("请输入反馈内容");
            fetch(`${API_BASE}/parent/submit-feedback`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ id: currentStudentH5.id, text: feedbackText }) })
                .then(res => res.json()).then(data => { alert(data.msg); document.getElementById('parentFeedbackInput').value=''; });
        }
    </script>
</body>
</html>
